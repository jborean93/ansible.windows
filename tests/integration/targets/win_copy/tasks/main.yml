---
- name: create empty folder
  file:
    path: '{{role_path}}/files/subdir/empty'
    state: directory
  delegate_to: localhost

# removes the cached zip module from the previous task so we can replicate
# the below issue where win_copy would delete DEFAULT_LOCAL_TMP if it
# had permission to
# https://github.com/ansible/ansible/issues/35613
- name: clear the local ansiballz cache
  file:
    path: "{{lookup('config', 'DEFAULT_LOCAL_TMP')}}/ansiballz_cache"
    state: absent
  delegate_to: localhost

- name: get working directory set for connection plugin
  win_powershell:
    script: '$pwd.Path'
  register: win_cwd_raw

- name: set working directory for connection plugin
  set_fact:
    win_cwd: '{{ win_cwd_raw.output[0] }}'

- name: create test folder
  win_file:
    path: '{{test_win_copy_path}}'
    state: directory

- name: create local temp directory
  tempfile:
    state: directory
  register: local_tmp
  delegate_to: localhost

- block:
  - name: run tests for local to remote
    include_tasks: tests.yml

  - name: run tests for remote to remote
    include_tasks: remote_tests.yml

  - name: run diff tests
    include_tasks: diff_tests.yml

  always:
  - name: remove test files
    win_file:
      path: '{{ item }}'
      state: absent
    loop:
    - '{{ test_win_copy_path }}'
    - '{{ win_cwd }}\local-file.txt'
    - '{{ win_cwd }}\remote-file.txt'

  - name: remove local temp directory
    file:
      path: '{{ local_tmp.path }}'
      state: absent
    delegate_to: localhost
